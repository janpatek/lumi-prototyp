<!doctype html>
<html lang="cs">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#F7F5FC">
  <title>Ospalek – administrace</title>
  <link rel="icon" href="../brand/maskot-3d/web/ospalek-mark-64.png" type="image/png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="admin.css?v=8">
  <script>
    // Téma: ruční volba z administrace, jinak podle systému
    (function () {
      var pref = null;
      try { pref = localStorage.getItem('ospalek.admin.theme'); } catch (e) {}
      var dark = pref ? pref === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
      document.documentElement.dataset.theme = dark ? 'dark' : 'light';
    })();
  </script>
</head>
<body class="locked">
  <div class="shell">
    <aside class="side">
      <a class="brand" href="#prehled">
        <img src="../brand/maskot-3d/web/ospalek-mark.webp" alt="">
        <span><b class="wordmark">Ospalek</b><small>administrace</small></span>
      </a>
      <button class="search-btn" type="button" data-a="palette"><svg class="ico" viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l5 5"/></svg><span>Hledat</span><kbd>⌘K</kbd></button>
      <nav class="nav" id="nav"></nav>
      <div class="side-foot">
        <div class="as">Zobrazit jako role</div>
        <select id="viewAs" aria-label="Zobrazit administraci jako role"></select>
        <button class="theme-btn" id="themeBtn" type="button"></button>
        <button class="theme-btn" type="button" onclick="adminLogout()"><svg class="ico" viewBox="0 0 24 24"><path d="M15 4h3a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2h-3M10 16l-4-4 4-4M6 12h10"/></svg><span>Odhlásit</span></button>
        <div class="perf" id="perf" title="Jak dlouho trvalo načíst data a vykreslit stránku"></div>
      </div>
    </aside>
    <main class="main" id="main"></main>
  </div>
  <div id="modal"></div>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <script src="../app/stories.cs.js?v=7"></script>
  <script src="../config.js?v=3"></script>
  <script src="demo-data.js?v=4"></script>
  <script src="live-data.js?v=8"></script>
  <script src="boot.js?v=10"></script>
</body>
</html>
