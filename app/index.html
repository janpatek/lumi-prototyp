  <script>
    // Téma Den/Noc: večer (19–7 h) Noc, jinak Den; ruční volba z nastavení má přednost
    (function () {
      var pref = null;
      try { pref = (JSON.parse(localStorage.getItem('lumi.v1')) || {}).theme; } catch (e) {}
      var h = new Date().getHours();
      var dark = pref === 'dark' || (pref !== 'light' && (h >= 19 || h < 7));
      document.documentElement.dataset.theme = dark ? 'dark' : 'light';
      document.querySelector('meta[name=theme-color]').content = dark ? '#1C1E33' : '#F7F5FC';
    })();
  </script>
</head>
