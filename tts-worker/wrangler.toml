# Ospalek – hlas pohádek (Cloudflare Worker). Návod: README.md v této složce.
name = "ospalek-tts"
main = "src/worker.js"
compatibility_date = "2025-06-01"

[vars]
# Weby, odkud smí aplikace hlas volat (čárkou oddělené, bez lomítka na konci)
# capacitor://localhost = aplikace na iOS, https://localhost = aplikace na Androidu (Capacitor)
ALLOWED_ORIGINS = "https://janpatek.github.io,https://ospalek.cz,https://www.ospalek.cz,http://localhost:5174,capacitor://localhost,https://localhost"
# Hlasy z tvého účtu ElevenLabs: název → Voice ID (najdeš v ElevenLabs u hlasu, tlačítko „ID“)
VOICES = '{"jana":"bF7C2fCv7Zf30iT84wZ1"}'
# Model musí být stejný jako u nahrávek vět v audio/hlas (eleven_v4), jinak budou na spojích slyšet rozdíly
MODEL_ID = "eleven_v4"
STABILITY = "0.75"
# Nejdelší text v jednom požadavku. Aplikace posílá po větách, nejdelší věta v pohádkách má ~190 znaků.
MAX_CHARS = "400"
# Nová věta (ta, co stojí kredity) se namluví jen přihlášené rodině a v mezích limitů v databázi (tabulka tts_limits,
# funkce app_tts_allow – supabase/migrations/20261117_zabezpeceni.sql). Věty z mezipaměti hrají všem jako dřív.
# "off" = bez ověření jako před 17. 11. 2026 (kdokoli s podvrženou hlavičkou Origin může čerpat kredity) – jen nouzově.
TTS_AUTH = "required"
# Databáze: POST /tts podle ní ověří přihlášení rodiny a limity, GET /naklady pozná člena týmu. Publishable klíč je veřejný (je i v config.js).
SUPABASE_URL = "https://imiujppjewddeldjifkl.supabase.co"
SUPABASE_KEY = "sb_publishable_uX729wkKmJ4vtTQaWcWzig_dGjzNaJC"

# Kolik nových vět (těch, co jdou do ElevenLabs) smí jedna IP adresa vygenerovat za minutu.
# Jedna pohádka pro novou rodinu potřebuje řádově desítky vět. Věty z mezipaměti se nepočítají.
[[ratelimits]]
name = "TTS_LIMIT"
namespace_id = "1001"
simple = { limit = 120, period = 60 }

# Volitelně trvalé uložení hotových nahrávek (Cloudflare R2, v malém objemu zdarma).
# Nejdřív `npx wrangler r2 bucket create ospalek-audio`, pak odkomentuj:
# [[r2_buckets]]
# binding = "AUDIO"
# bucket_name = "ospalek-audio"
